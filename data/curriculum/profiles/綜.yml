# 綜合活動領綱的抽取設定
#
# 學習表現以主題軸+主題項目編碼（1a-Ⅳ-1）；學習內容由家政/童軍/輔導三科
# 各自發展，前綴用中文簡稱（家Aa-Ⅳ-1、童Ba-Ⅳ-1、輔Cc-Ⅳ-1），
# 國小階段則無科別前綴（Aa-Ⅱ-1）。科別簡稱限定為 家/童/輔（國中）與 生/涯/家（高中），
# 不能用寬鬆的「任意中文字」——那會把內文的中文誤當前綴（如「並Bb-Ⅱ-1」）。
# ⚠️ 本領綱的羅馬數字全部使用拉丁字母（IV、V），抽取時正規化。
domain: 綜合活動
prefix: 綜
strategy: tables-split
stageKind: roman
patterns:
  performance: '(\d[a-z])-([IVXⅠⅡⅢⅣⅤ]+)-(\d+)'
  content:     '([家童輔生涯]? ?[A-Z][a-z])-([IVXⅠⅡⅢⅣⅤ]+)-(\d+)'
