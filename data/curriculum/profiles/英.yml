# 英語文領綱的抽取設定
#
# tables-split：指標表是「依學習階段並排」的多欄表，同一個儲存格裡會塞進
# 好幾筆指標。整格當一筆會得到合併的亂碼，逐行則會被欄位交錯打散。
# 做法是先取儲存格，再依代碼出現位置切段。
domain: 英語文
prefix: 英
strategy: tables-split
stageKind: roman
patterns:
  performance: '(\d)-([ⅠⅡⅢⅣⅤIV]+)-(\d+)'
  content:     '([A-Z][a-z]?)-([ⅠⅡⅢⅣⅤIV]+)-(\d+)'

# 跨頁截斷的補正
#
# PDF 的表格儲存格被頁面邊界切斷，後半段落在下一頁的續表首欄。
# 抽取器兩段都看得到，但無法自動判斷屬於同一筆。以下明確宣告接續內容，
# 並註明來源頁碼供查核——這是把兩個片段接起來，不是憑空補字。
continuations:
  D-Ⅲ-3:
    text: 資訊作簡易猜測。
    source: 第 22 頁末「依綜合」＋第 23 頁首「資訊作簡易猜測。」
